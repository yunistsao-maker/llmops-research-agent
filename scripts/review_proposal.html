<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proposal 審核檢視器</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2128; --mute:#5b6572; --line:#dde1e6; --ok:#17794a; --warn:#9a6700; --bad:#b42318; --acc:#2557d6; --chip:#eef1f5; --code:#f1f3f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171c; --card:#1c2128; --ink:#e6e9ed; --mute:#9aa4b0; --line:#2e3640; --ok:#4cc38a; --warn:#e3b341; --bad:#ff7b72; --acc:#7aa2ff; --chip:#262d36; --code:#242b34; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:20px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:16px; margin:28px 0 10px; } h3 { font-size:15px; margin:0 0 4px; }
  .sub { color:var(--mute); font-size:13px; }
  .drop { margin:14px 0; padding:18px; border:2px dashed var(--line); border-radius:10px; text-align:center; background:var(--card); }
  .drop.over { border-color:var(--acc); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:8px 0; }
  .banner { border-radius:10px; padding:10px 14px; margin:8px 0; border:1px solid; font-size:14px; }
  .banner.bad { color:var(--bad); border-color:var(--bad); } .banner.warn { color:var(--warn); border-color:var(--warn); } .banner.ok { color:var(--ok); border-color:var(--ok); }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
  .stat b { display:block; font-size:18px; } .stat span { color:var(--mute); font-size:12px; }
  .chip { display:inline-block; background:var(--chip); border-radius:99px; padding:0 8px; font-size:12px; margin:0 4px 2px 0; color:var(--mute); }
  .chip.high { color:var(--bad); } .chip.medium { color:var(--warn); } .chip.ok { color:var(--ok); }
  .muted { color:var(--mute); font-size:12px; margin-bottom:0; }
  code, pre { background:var(--code); border-radius:6px; font:12.5px ui-monospace,SFMono-Regular,Menlo,monospace; }
  code { padding:1px 5px; word-break:break-all; } pre { padding:10px; overflow:auto; max-height:360px; }
  blockquote { margin:6px 0; padding:4px 10px; border-left:3px solid var(--line); color:var(--mute); font-size:13px; word-break:break-word; }
  .diff { display:grid; grid-template-columns:1fr 1fr; gap:8px; } @media (max-width:640px){ .diff { grid-template-columns:1fr; } }
  .diff div { padding:8px; border-radius:6px; font-size:13px; word-break:break-word; white-space:pre-wrap; }
  .old { background:rgba(180,35,24,.10); } .new { background:rgba(23,121,74,.12); }
  table { width:100%; border-collapse:collapse; font-size:13px; } td,th { text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  details summary { cursor:pointer; color:var(--acc); }
  a { color:var(--acc); } ul { margin:4px 0; padding-left:20px; }
  .empty { color:var(--mute); font-style:italic; }
</style>
</head>
<body>
<main>
  <h1>Proposal 審核檢視器</h1>
  <div class="sub">唯讀、完全在本機執行：選取 <code>invoke_agent.py --out</code> 產生的 JSON（或 S3 下載的 <code>research/proposals/*.json</code>）。檔案不會上傳到任何地方；網頁來源的文字一律以純文字顯示。</div>
  <label class="drop" id="drop"><input type="file" id="file" accept=".json,application/json"> 或把檔案拖到這裡</label>
  <div id="out"></div>
</main>
<script>
"use strict";
// Every piece of text below comes from untrusted web pages and from a model: build DOM nodes with textContent only, never
// innerHTML; never build a class name or an attribute from the data; and expect any field to have any shape.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (v != null) el.setAttribute(k, v); }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid.nodeType ? kid : document.createTextNode(text(kid))); }
  return el;
}
const out = document.getElementById("out");
const arr = v => (Array.isArray(v) ? v : []);
const obj = v => (v !== null && typeof v === "object" && !Array.isArray(v) ? v : {});
/** Anything as text: strings as they are, everything else as JSON (never "[object Object]", never a thrown error). */
function text(v) {
  if (typeof v === "string") return v;
  if (v === undefined) return "";
  try { const j = JSON.stringify(v); return j === undefined ? String(v) : j; } catch (e) { return "（無法顯示的值）"; }
}
// A number the browser could not read as written (1e999, an integer of 400 digits) arrives here as Infinity, and
// JSON.stringify would print it as "null": say what it is instead.
const UNREADABLE = "（瀏覽器讀不出的數字：超出範圍）";
const honest = (k, v) => (typeof v === "number" && !isFinite(v) ? UNREADABLE : v);
function fmt(v) {
  if (v === undefined) return "（無）";
  if (typeof v === "string") return v;
  try { return JSON.stringify(v, honest, 2); } catch (e) { return "（無法顯示的值）"; }
}
/**
 * The number literals of a JSON text that this page cannot show as they are written: beyond what a double holds
 * exactly (2^53 - 1), or beyond what it holds at all.  Found in the text itself, because after JSON.parse they look
 * like ordinary numbers.
 */
function unsafeNumbers(raw) {
  const found = [];
  const token = /"(?:[^"\\]|\\.)*"|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;
  let m;
  while ((m = token.exec(raw)) !== null && found.length < 20) {
    if (m[0][0] === '"') continue;
    const n = Number(m[0]);
    if (!isFinite(n) || (/^-?\d+$/.test(m[0]) && !Number.isSafeInteger(n))) found.push(m[0].length > 40 ? m[0].slice(0, 40) + "…（" + m[0].length + " 位）" : m[0]);
  }
  return found;
}
const num = v => (typeof v === "number" && isFinite(v) ? v : null);

/**
 * A link only for a plain https:// address, and always with the host it really leads to in front: a URL can be written
 * so that it reads like another site ("https://login.example@evil.example/").
 */
function link(url, label) {
  if (typeof url !== "string" || url === "") return h("code", {}, text(url));
  let u = null;
  if (/^https:\/\/[^\s\\]+$/.test(url)) { try { u = new URL(url); } catch (e) { /* not a URL */ } }
  if (!u || u.protocol !== "https:" || u.username || u.password || !u.hostname) return h("span", {}, h("code", {}, url), h("span", { class: "chip high" }, "不是單純的 https 網址，不建立連結"));
  return h("span", {}, h("b", {}, u.hostname), " ", h("a", { href: u.href, target: "_blank", rel: "noopener noreferrer" }, label != null ? text(label) : url));
}
const section = (title, ...kids) => [h("h2", {}, title), ...kids];
// Class names come from these lists and from nowhere else: a value read from the file ("constructor", "__proto__") is a key
// of every object, so it is looked up as an own property or not at all.
const pick = (table, key) => (typeof key === "string" && Object.prototype.hasOwnProperty.call(table, key) ? table[key] : "");
const KINDS = { ok: "ok", warn: "warn", bad: "bad" };
const banner = (kind, ...kids) => h("div", { class: "banner " + (pick(KINDS, kind) || "warn") }, ...kids);
const IMPACT = { high: "high", medium: "medium" };
const CHIPS = { high: "high", medium: "medium", ok: "ok" };
const chip = (label, kind) => h("span", { class: "chip" + (pick(CHIPS, kind) ? " " + pick(CHIPS, kind) : "") }, label);
const quote = (e, head) => h("blockquote", {}, h("div", {}, head), h("div", {}, link(e.url)),
  text(e.under) ? h("div", {}, "位置：" + text(e.under)) : null, text(e.header) ? h("div", {}, "表頭：" + text(e.header)) : null, h("div", {}, "「" + text(e.quote) + "」"));

function render(r, raw) {
  out.replaceChildren();
  r = obj(r);
  // Which part of the file is the proposal?  The same answer as the publishing pipeline gives (publish.split_record):
  // a document that says it is a proposal IS the proposal, whatever else it carries; otherwise a run record's `proposal`.
  const isProposal = r.schema === "llmops-research-proposal/v1";
  const isRun = !isProposal && (Object.prototype.hasOwnProperty.call(r, "status") || r.type === "result");
  const p = isProposal ? r : (isRun ? obj(r.proposal) : {});
  const carriesAnother = isProposal && Object.keys(obj(r.proposal)).length > 0;
  const stats = obj(r.stats), pstats = obj(p.stats);
  const pages = arr(stats.pages).length ? arr(stats.pages).map(obj) : arr(pstats.pages).map(obj);
  const evidence = obj(p.evidence), ops = arr(p.ops).map(obj), newSources = arr(p.newSources).map(obj);
  const urlOf = new Map(newSources.filter(s => typeof s.id === "string").map(s => [s.id, s.url]));
  const add = (...nodes) => nodes.flat(Infinity).forEach(n => n != null && n !== false && out.append(n));
  // One part that cannot be drawn must not hide the others: what is shown here is what somebody approves.
  const part = (name, draw) => {
    try { draw(); } catch (e) { add(banner("bad", `「${name}」這一段無法顯示（內容的形狀和預期不同：${e && e.message ? e.message : e}）。請看最下面的原始 JSON。`)); }
  };

  part("狀態", () => {
    const st = text(r.status) || "?";
    if (!isProposal && !isRun) add(banner("bad", "這個檔案不是提案，也不是 run 紀錄（沒有 schema = llmops-research-proposal/v1，也沒有 status）：發布流程不會接受它。"));
    if (carriesAnother) add(banner("bad", "⚠ 這個檔案本身是一份提案，裡面又夾帶了另一份（proposal 欄位）。發布流程使用的是最外層這一份，下面顯示的也是這一份；夾帶的那一份不會被發布。正常的 agent 不會寫出這種檔案。"));
    const odd = unsafeNumbers(typeof raw === "string" ? raw : "");
    if (odd.length) add(banner("bad", "檔案裡有瀏覽器無法照原樣讀取的數字（超出可精確表示的範圍）：下面顯示的這些值不可靠，發布流程會拒絕這樣的資料。", h("ul", {}, odd.map(x => h("li", {}, h("code", {}, x))))));
    if (isProposal && !r.status) add(banner("warn", "這是一份提案檔（不含 run 的狀態、驗證報告與抓取紀錄）；完整資訊在 research/runs/ 底下的 run 紀錄。"));
    else if (isRun || r.status) add(banner(st === "accepted" ? "ok" : st === "no_proposal" ? "warn" : "bad", `status：${st}`, r.stopReason ? `（${text(r.stopReason)}）` : "", r.error ? ` ${text(r.error)}` : ""));
    if (obj(p.portal).sample) add(banner("bad", "⚠ 這份提案是依「內建 SAMPLE 快照」產生的，不是你的 portal 資料。不要套用；請設定 PORTAL_DATA_URI（同步真實 portal 資料）後重跑。"));
    const report = obj(r.report), validation = obj(p.validation), flags = obj(validation.flags);
    for (const e of arr(report.errors)) add(banner("bad", "驗證錯誤：" + text(e)));
    const warnings = arr(report.warnings).length ? arr(report.warnings) : arr(validation.warnings);
    for (const w of warnings) add(banner("warn", "警告：" + text(w)));
    if (arr(flags.instructionLikeText).length) add(banner("bad", "含有像是「對 AI 下指令」的文字（自動發布會改成等待核准）：", h("ul", {}, arr(flags.instructionLikeText).map(x => h("li", {}, text(x))))));
    if (arr(flags.unseenUrls).length) add(banner("warn", "提案裡有這次研究沒有讀過的網址：", h("ul", {}, arr(flags.unseenUrls).map(x => h("li", {}, h("code", {}, text(x)))))));
    if (arr(flags.digestNotReread).length) add(banner("warn", "digest 有項目引用的頁面這次沒有重新讀取，只是重述 portal 既有的內容（自動發布會改成等待核准）：", h("ul", {}, arr(flags.digestNotReread).map(x => h("li", {}, text(x))))));
    if (arr(flags.uncertainSubject).length) add(banner("warn", "有些值，程式無法確定引文講的就是這筆紀錄（同一行有別的名稱、別的平台，或讀法不只一種；自動發布會改成等待核准）：", h("ul", {}, arr(flags.uncertainSubject).slice(0, 40).map(x => h("li", {}, text(x))))));
    if (arr(flags.uncheckedValue).length) add(banner("warn", "有些值沒有引文可以逐字對照（版本欄位裡不是版本號的寫法、查不到的公告編號、沒有年份的日期；自動發布會改成等待核准）：", h("ul", {}, arr(flags.uncheckedValue).slice(0, 40).map(x => h("li", {}, text(x))))));
    if (arr(flags.digestUnsourced).length) add(banner("warn", "digest 有內容沒有這次讀過的頁面可以佐證（自動發布會改成等待核准）：", h("ul", {}, arr(flags.digestUnsourced).slice(0, 40).map(x => h("li", {}, text(x))))));
    // a kind of flag this page has no sentence for is still a flag: the pipeline holds for every one of them
    for (const kind of Object.keys(flags)) {
      if (["instructionLikeText", "unseenUrls", "digestNotReread", "uncertainSubject", "uncheckedValue", "digestUnsourced"].includes(kind)) continue;
      const items = Array.isArray(flags[kind]) ? flags[kind] : (flags[kind] ? [flags[kind]] : []);
      if (items.length) add(banner("warn", `agent 的驗證標記了需要人工確認的項目（${kind}，自動發布會改成等待核准）：`, h("ul", {}, items.slice(0, 20).map(x => h("li", {}, text(x))))));
    }
    const empties = pages.filter(x => x.chars === 0);
    if (empties.length) add(banner("warn", `有 ${empties.length} 個頁面抓回來是空的（常見原因：JS 渲染）：`, h("ul", {}, empties.map(x => h("li", {}, link(x.url))))));
  });

  part("統計", () => {
    const u = obj(r.usage);
    const stat = (v, l) => h("div", { class: "card stat" }, h("b", {}, v == null || v === "" ? "—" : text(v)), h("span", {}, l));
    add(h("div", { class: "grid" }, stat(num(r.elapsedSeconds) != null ? r.elapsedSeconds + " 秒" : null, "耗時"), stat(stats.searches, "搜尋"), stat(stats.fetches, "抓頁"), stat(stats.toolCalls, "tool call"),
      stat(num(u.totalTokens) != null ? u.totalTokens.toLocaleString() : null, "token 總量"), stat(stats.evidence, "引文證據")));
  });

  part("摘要", () => { if (p.summary) add(section("摘要", h("div", { class: "card" }, text(p.summary)))); });

  part("資料變更", () => {
    add(section(`資料變更（${ops.length}）`));
    if (!ops.length) add(h("div", { class: "card empty" }, "ops 是空的：這次沒有要改 catalog / lifecycle / litellm 等檔案的項目（可能只有 digest 或新來源）。"));
    for (const op of ops) {
      part(`${text(op.file)}${text(op.path)}`, () => {
        const ev = arr(op.evidence).map(id => (typeof id === "string" ? evidence[id] : null)).filter(e => e !== null && typeof e === "object").map(obj);
        // What is added had no value before.  An `add` that carries one anyway is not something the agent writes (the
        // pipeline refuses it); showing it as "原值" would make an addition look like a small correction.
        const adds = op.op === "add", stray = adds && Object.prototype.hasOwnProperty.call(op, "before");
        add(h("div", { class: "card" },
          h("h3", {}, h("code", {}, `${text(op.op)} ${text(op.file)}${text(op.path)}`)),
          stray ? banner("bad", "這個 add operation 帶有 before 欄位：新增的內容沒有原值，發布流程會拒絕這份提案。") : null,
          h("div", { class: "diff" }, h("div", { class: "old" }, adds ? "（新增：原本沒有這個值）" : "原值\n" + fmt(op.before)),
            h("div", { class: "new" }, op.op === "remove" ? "（刪除）" : "新值\n" + fmt(op.value))),
          op.rationale ? h("p", {}, text(op.rationale)) : null,
          ev.map(e => quote(e, `${text(e.tier) || "?"} · ${text(e.publisher)} · 抓取 ${text(e.fetchedAt)}`))));
      });
    }
  });

  // quotes that no data change cites: they back the digest and the summary (or were recorded and not used)
  part("其他引文", () => {
    const used = new Set(ops.flatMap(op => arr(op.evidence)).filter(id => typeof id === "string"));
    const rest = Object.entries(evidence).filter(([id, e]) => !used.has(id) && e !== null && typeof e === "object").map(([id, e]) => [id, obj(e)]);
    if (rest.length) add(section(`其他引文（${rest.length}）`, h("div", { class: "card" },
      h("p", {}, "沒有對應到上面任何一項資料變更的引文：digest 與摘要的依據，或是 agent 記下但最後沒有用到的。"),
      rest.map(([id, e]) => quote(e, `${id} · ${text(e.tier) || "?"} · ${text(e.publisher)} · 抓取 ${text(e.fetchedAt)}${e.cited === false ? " · 未被引用" : ""}`)))));
  });

  part("新增來源", () => {
    if (newSources.length) add(section("新增來源", h("div", { class: "card" }, h("table", {}, h("tr", {}, ["id", "標題", "發布者", "類型", "網址"].map(x => h("th", {}, x))),
      newSources.map(x => h("tr", {}, h("td", {}, text(x.id)), h("td", {}, text(x.title)), h("td", {}, text(x.publisher)), h("td", {}, text(x.type)), h("td", {}, link(x.url))))))));
  });

  part("freshness（asOf、lastVerified、accessed）", () => {
    const validation = obj(p.validation), asOf = obj(validation.asOfCoverage), verified = obj(validation.lastVerifiedCoverage);
    // "read 3 of 32": the agent's own account of how much of what a file / a record cites was read in this run
    const covered = c => {
      const cited = num(obj(c).cited), read = num(obj(c).read);
      if (cited === null || read === null) return chip("沒有記錄讀了哪些來源", "high");
      return chip(`讀了 ${read} / ${cited} 個來源`, read >= cited && cited > 0 ? "ok" : "high");
    };
    const records = Object.keys(verified);
    if (arr(p.asOfFiles).length || arr(p.touchSources).length || records.length) add(section("標記為「今天重新確認過」", h("div", { class: "card" },
      arr(p.asOfFiles).length ? h("p", {}, "整個檔案（asOf）：", arr(p.asOfFiles).map(x => h("span", {}, h("code", {}, text(x)), " ", covered(Object.prototype.hasOwnProperty.call(asOf, text(x)) ? asOf[text(x)] : null), " "))) : null,
      records.length ? h("p", {}, "單筆資料（lastVerified）：", records.map(x => h("span", {}, h("code", {}, x), " ", covered(verified[x]), " "))) : null,
      arr(p.touchSources).length ? h("p", {}, "這次讀過的來源（accessed 會更新為當天）：", arr(p.touchSources).map(x => chip(text(x)))) : null,
      h("p", { class: "muted" }, "沒有讀完全部來源的標記不會自動發布，會等人核准。"))));
  });

  part("Weekly digest", () => {
    if (p.digest === null || p.digest === undefined) return;
    const d = obj(p.digest);
    // Everything this part draws is collected, so that it can be checked afterwards against what the digest holds: the
    // publisher takes the whole digest, and the portal's first page shows all of it.
    const drawn = [];
    const put = (...nodes) => nodes.flat(Infinity).forEach(n => { if (n != null && n !== false) { drawn.push(n); out.append(n); } });
    put(section(`Weekly digest ${text(d.id)}（${text(d.periodStart)} → ${text(d.periodEnd)}）`, h("div", { class: "card" }, text(d.headline),
      h("p", { class: "muted" }, ["schema", "locale", "generatedAt"].filter(k => d[k] !== undefined).map(k => `${k}：${text(d[k])}`).join("　")))));
    const sec = [["newModels", "新模型"], ["lifecycleChanges", "生命週期"], ["pricingChanges", "價格"], ["litellm", "LiteLLM"], ["security", "資安"], ["regulatory", "法規"]];
    // a citation is an id and, sometimes, a note - and the note is shown on the portal next to it
    const srcs = list => arr(list).map(x => (x !== null && typeof x === "object" && !Array.isArray(x) ? x : { id: x })).map(x => h("span", { class: "chip" },
      typeof x.id === "string" && urlOf.has(x.id) ? link(urlOf.get(x.id), x.id) : text(x.id), x.note !== undefined && x.note !== "" ? "（附註：" + text(x.note) + "）" : ""));
    for (const [key, label] of sec) {
      const items = arr(d[key]).map(obj);
      if (!items.length) continue;
      put(h("h2", {}, `${label}（${items.length}）`));
      for (const i of items) {
        part(`${label}：${text(i.title)}`, () => put(h("div", { class: "card" },
          h("h3", {}, text(i.title)),
          h("div", {}, i.impact ? chip("影響：" + text(i.impact), pick(IMPACT, i.impact)) : null, i.date ? chip(text(i.date)) : null, i.vendor ? chip(text(i.vendor)) : null, arr(i.clouds).map(c => chip(text(c)))),
          h("p", {}, text(i.detail)), h("div", {}, srcs(i.sources)))));
      }
    }
    const actions = arr(d.actionItems).map(obj), watch = arr(d.watchlist).map(obj);
    if (actions.length) put(h("h2", {}, `行動項目（${actions.length}）`), actions.map(a => h("div", { class: "card" }, chip(text(a.priority), a.priority === "P0" ? "high" : ""), a.due ? chip("期限 " + text(a.due)) : null, " " + text(a.action),
      arr(a.relatedModelIds).length ? h("div", {}, "相關模型（portal 會連到它們的頁面）：", arr(a.relatedModelIds).map(x => chip(text(x)))) : null)));
    if (watch.length) put(h("h2", {}, `追蹤清單（${watch.length}）`), watch.map(w => h("div", { class: "card" }, h("h3", {}, text(w.name)), h("div", {}, chip(text(w.status)), chip(text(w.vendor)), w.expected ? chip("預期：" + text(w.expected)) : null), h("p", {}, text(w.note)), h("div", {}, srcs(w.sources)))));
    const loose = arr(d.unverified);
    if (loose.length) put(h("h2", {}, `本期尚未驗證（${loose.length}）`), h("div", { class: "card" }, h("p", { class: "muted" }, "這些句子會照樣出現在 portal 首頁的「本期尚未驗證」。"),
      h("ul", {}, loose.map(x => h("li", {}, text(x))))));
    // Whatever the layout above did not use is listed here, with where it stands: a field this page has no place for
    // (a new one, a misspelt one, one of an odd shape) is published like the rest, so it is shown like the rest.
    const seen = drawn.map(n => n.textContent || "").join("\n").replace(/\s+/g, " ");
    const left = [];
    const walk = (value, path, depth) => {
      if (left.length >= 200 || depth > 12) return;
      if (Array.isArray(value)) value.forEach((v, i) => walk(v, `${path}[${i}]`, depth + 1));
      else if (value !== null && typeof value === "object") for (const k of Object.keys(value)) walk(value[k], path ? `${path}.${k}` : k, depth + 1);
      else if ((typeof value === "string" && value.trim() !== "") || typeof value === "number" || typeof value === "boolean") {
        const shown = (typeof value === "string" ? value : text(honest("", value))).replace(/\s+/g, " ").trim();
        if (typeof value === "boolean" || !seen.includes(shown)) left.push([path, value]);
      }
    };
    walk(d, "", 0);
    if (left.length) put(h("h2", {}, `digest 的其他內容（${left.length}${left.length >= 200 ? "，只列出前 200 項" : ""}）`), h("div", { class: "card" },
      h("p", { class: "muted" }, "上面的版面沒有畫出這些欄位，但它們和 digest 的其他部分一樣會被發布。"),
      h("table", {}, h("tr", {}, ["位置", "內容"].map(x => h("th", {}, x))), left.map(([where, value]) => h("tr", {}, h("td", {}, h("code", {}, where)), h("td", {}, fmt(honest("", value))))))));
  });

  part("未能確認／已檢查", () => {
    const unverified = arr(p.unverified).map(x => (typeof x === "string" ? { claim: x } : obj(x))), checked = arr(p.checked).map(x => (typeof x === "string" ? { topic: x } : obj(x)));
    if (unverified.length) add(section("未能確認", h("div", { class: "card" }, h("ul", {}, unverified.map(x => h("li", {}, h("b", {}, text(x.claim)), x.reason ? " — " + text(x.reason) : ""))))));
    if (checked.length) add(section("已檢查", h("div", { class: "card" }, h("ul", {}, checked.map(x => h("li", {}, h("b", {}, text(x.topic)), " — ", text(x.result)))))));
  });

  part("抓取的頁面", () => {
    if (pages.length) add(section(`抓取的頁面（${pages.length}）`, h("div", { class: "card" }, h("table", {}, h("tr", {}, ["網址", "層級", "字元數", "備註"].map(x => h("th", {}, x))),
      pages.map(x => h("tr", {}, h("td", {}, link(x.url)), h("td", {}, text(x.tier)), h("td", {}, text(x.chars)), h("td", {}, [x.chars === 0 && "空頁面", x.truncated && "已截斷", x.suspiciousText && "疑似 prompt injection"].filter(Boolean).join("、"))))))));
  });

  part("原始 JSON", () => add(section("原始 JSON", h("details", {}, h("summary", {}, "展開"), h("pre", {}, typeof raw === "string" && raw.length < 2000000 ? raw : JSON.stringify(r, honest, 2))))));
}

function load(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let doc;
    try { doc = JSON.parse(rd.result); } catch (e) { out.replaceChildren(banner("bad", "無法解析 JSON：" + e.message)); return; }
    if (doc === null || typeof doc !== "object" || Array.isArray(doc)) { out.replaceChildren(banner("bad", "這不是 run 紀錄或提案：最外層應該是一個 JSON 物件。")); return; }
    try { render(doc, String(rd.result)); } catch (e) { out.append(banner("bad", "顯示時發生未預期的錯誤：" + (e && e.message ? e.message : e))); }
  };
  rd.onerror = () => out.replaceChildren(banner("bad", "讀不到這個檔案。"));
  rd.readAsText(file);
}
document.getElementById("file").addEventListener("change", e => e.target.files[0] && load(e.target.files[0]));
const drop = document.getElementById("drop");
["dragover", "dragenter"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => e.dataTransfer.files[0] && load(e.dataTransfer.files[0]));
</script>
